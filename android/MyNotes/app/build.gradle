plugins {
  id "com.android.application"
}

android {
  namespace "io.qzz.superstar1014.mynotes"
  compileSdk 36

  defaultConfig {
    applicationId "io.qzz.superstar1014.mynotes"
    minSdk 36
    targetSdk 36
    versionCode 36
    versionName "2.25"
    testInstrumentationRunner "io.qzz.superstar1014.mynotes.CryptoTestRunner"
  }

  // Keep upgrade signing stable even when ANDROID_USER_HOME is a temporary build directory.
  signingConfigs {
    debug {
      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:5.4.0"
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += ["-Xlint:deprecation"]
}
