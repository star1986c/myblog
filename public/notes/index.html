<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>私人笔记 | AI Build Lab</title>
    <meta name="description" content="仅供本人使用的私人笔记工作区。" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="theme-color" content="#f4f8f6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/notes.20260813-v2.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="main-content" tabindex="-1">

    <main class="login-shell" data-login-shell>
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7 3.75h8.5L19 7.25V20.25H7z" />
            <path d="M15.5 3.75v3.5H19M10 11h6M10 14.5h6" />
          </svg>
        </div>
        <p class="eyebrow">Private workspace</p>
        <h1 id="login-title">私人笔记</h1>
        <p class="login-description">登录后才能读取或编辑。所有笔记均保持私密，不提供公开分享链接。</p>

        <form class="login-form" data-login-form>
          <label>
            用户名
            <input name="username" autocomplete="username" required autofocus />
          </label>
          <label>
            密码
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-button" type="submit" data-login-button>登录</button>
          <p class="form-message" data-login-message role="alert"></p>
        </form>
        <a class="quiet-link" href="/">返回首页</a>
      </section>
    </main>

    <div class="app-shell" data-app-shell hidden>
      <header class="app-header">
        <div class="app-brand">
          <span class="app-brand__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 3.75h8.5L19 7.25V20.25H7z" />
              <path d="M15.5 3.75v3.5H19M10 11h6M10 14.5h6" />
            </svg>
          </span>
          <span>
            <strong>私人笔记</strong>
            <small>仅本人可见</small>
          </span>
        </div>

        <div class="header-actions">
          <span class="privacy-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" />
            </svg>
            私密
          </span>
          <button class="text-button" type="button" data-settings-open>设置</button>
          <a href="/">首页</a>
          <button class="text-button" type="button" data-logout>退出</button>
        </div>
      </header>

      <div class="security-notice" data-security-notice hidden>
        当前账号仍使用初始密码。请在此处
        <button type="button" data-settings-notice-open>修改登录密码</button>。
      </div>

      <main class="workspace-loading-shell" data-workspace-loading>
        <section class="workspace-loading-card" aria-labelledby="loading-title">
          <div class="gate-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10M12 14v2" />
            </svg>
          </div>
          <p class="eyebrow">Encrypted workspace</p>
          <h1 id="loading-title">正在打开私人笔记</h1>
          <p data-loading-message role="status" aria-live="polite">正在恢复加密密钥并读取笔记…</p>
        </section>
      </main>

      <main class="notes-layout" data-notes-layout hidden>
        <aside class="notes-sidebar" aria-label="笔记列表">
          <div class="sidebar-heading">
            <div>
              <p class="eyebrow">My notes</p>
              <h1>我的笔记</h1>
            </div>
            <button class="new-note-button" type="button" data-new-note>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              新建
            </button>
          </div>

          <label class="search-box">
            <span class="visually-hidden">搜索笔记</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4 4" />
            </svg>
            <input type="search" placeholder="搜索标题和正文" autocomplete="off" spellcheck="false" data-search />
          </label>

          <div class="list-summary">
            <span data-note-count>0 条笔记</span>
            <span data-search-summary></span>
          </div>
          <div class="note-list" data-note-list></div>
        </aside>

        <section class="editor-pane" aria-label="笔记编辑器">
          <div class="editor-empty" data-editor-empty>
            <div class="empty-illustration" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <path d="M18 10h22l8 8v36H18z" />
                <path d="M40 10v9h8M25 29h16M25 37h16M25 45h10" />
              </svg>
            </div>
            <h2>写下第一条笔记</h2>
            <p>从一个想法、一段清单或今天的记录开始。</p>
            <button class="primary-button compact" type="button" data-empty-new>新建笔记</button>
          </div>

          <form class="note-editor" data-note-form hidden>
            <div class="editor-toolbar">
              <button class="mobile-back" type="button" data-mobile-back>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
                返回列表
              </button>
              <p class="save-status" data-save-status role="status" aria-live="polite">已保存</p>
              <button class="delete-button" type="button" data-delete-note>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M9 7V4h6v3M8 10v8M12 10v8M16 10v8M6 7l1 14h10l1-14" />
                </svg>
                删除
              </button>
            </div>

            <div class="editor-content">
              <label class="visually-hidden" for="note-title">笔记标题</label>
              <input id="note-title" class="title-input" name="title" maxlength="200" placeholder="无标题笔记" autocomplete="off" spellcheck="false" data-note-title />
              <div class="editor-meta">
                <span data-updated-at></span>
                <span data-character-count>0 个字</span>
              </div>
              <label class="visually-hidden" for="note-content">笔记正文</label>
              <textarea
                id="note-content"
                class="content-input"
                name="content"
                maxlength="500000"
                placeholder="开始记录……"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                data-note-content
              ></textarea>
            </div>
          </form>
        </section>
      </main>
      <p class="global-message" data-global-message role="alert" aria-live="assertive"></p>

      <dialog class="settings-dialog" data-settings-dialog aria-labelledby="settings-title">
        <form class="settings-card" data-settings-form>
          <div class="settings-heading">
            <div>
              <p class="eyebrow">Account security</p>
              <h2 id="settings-title">登录账号设置</h2>
            </div>
            <button class="dialog-close" type="button" data-settings-close aria-label="关闭账号设置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <p class="settings-copy">这里只修改登录账号。记事加密密钥独立保存，修改或重置登录密码不会再导致笔记打不开。</p>
          <label>
            用户名
            <input name="username" autocomplete="username" maxlength="80" required />
          </label>
          <label>
            当前登录密码
            <input name="currentPassword" type="password" autocomplete="current-password" required />
          </label>
          <label>
            新登录密码（至少 12 个字符）
            <input name="newPassword" type="password" minlength="12" maxlength="256" autocomplete="new-password" required />
          </label>
          <label>
            再输入一次新密码
            <input name="confirmPassword" type="password" minlength="12" maxlength="256" autocomplete="new-password" required />
          </label>
          <p class="form-message" data-settings-message role="alert"></p>
          <div class="settings-actions">
            <button class="text-button" type="button" data-settings-close>取消</button>
            <button class="primary-button compact" type="submit">保存设置</button>
          </div>
        </form>
      </dialog>
    </div>
    </div>

    <noscript>私人笔记需要启用 JavaScript 才能使用。</noscript>
    <script type="module" src="/assets/notes.20260813-v3.js"></script>
  </body>
</html>
